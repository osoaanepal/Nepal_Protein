      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Shield / Square -->
  <rect width="64" height="64" rx="16" fill="#0f172a" />
  <!-- Accent Edge Highlight -->
